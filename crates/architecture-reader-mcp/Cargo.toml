[package]
name = "architecture-reader-mcp"
version = "0.0.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust MCP server scaffold for Architecture Reader."

[lib]
path = "src/lib.rs"

[[bin]]
name = "architecture-reader-mcp"
path = "src/main.rs"

[dependencies]
architecture-reader-core = { path = "../architecture-reader-core" }
rmcp = { version = "2.2.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
