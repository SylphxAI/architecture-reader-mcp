[package]
name = "architecture-reader-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON CLI bridge for Architecture Reader MCP engine."

[[bin]]
name = "architecture-reader-cli"
path = "src/main.rs"

[dependencies]
architecture-reader-core = { path = "../architecture-reader-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"