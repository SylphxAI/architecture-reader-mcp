name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to publish package.json version to npm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: sylphx-linux-standard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true
      - name: Publish Spine package (isolated copy)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN="${NODE_AUTH_TOKEN:-$NPM_TOKEN}"
          test -n "$TOKEN"
          STAGE=$(mktemp -d)
          cp -a packages/mcp-server/. "$STAGE/"
          cd "$STAGE"
          # install only typescript for prepublish typecheck
          npm install --no-save typescript@7 @types/node@26
          printf '//registry.npmjs.org/:_authToken=%s\nalways-auth=true\n' "$TOKEN" > "$HOME/.npmrc"
          export NPM_CONFIG_USERCONFIG="$HOME/.npmrc"
          npm whoami
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          echo "Publishing $NAME@$VER"
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo already "$NAME@$VER"; npm view "$NAME" version dist-tags; exit 0
          fi
          npm publish --access public
          npm view "$NAME@$VER" version
          npm view "$NAME" version dist-tags
