name: bench-impact

# Impact precision and recall at file level over the 30 cases in
# bench/impact/gold.json. Manual only; runs on a standard GitHub-hosted runner
# like the other bench workflows. bench/impact/README.md explains the method.

on:
  workflow_dispatch:
    inputs:
      repos:
        description: 'Only these repositories (space separated names from gold.json; empty = all)'
        default: ''

permissions:
  contents: read

jobs:
  impact:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo build --release --locked -p sylphx-repomap
      - name: Run the benchmark
        env:
          REPOS: ${{ inputs.repos }}
        run: |
          set -euo pipefail
          args=()
          for r in $REPOS; do args+=(--repo "$r"); done
          floor=()
          if [ -f bench/impact/floor.json ] && [ -z "$REPOS" ]; then floor=(--floor bench/impact/floor.json); fi
          mkdir -p out
          python3 bench/impact/run.py target/release/repomap /tmp/impact-corpus out/impact.json "${args[@]}" "${floor[@]}" | tee out/impact.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impact
          path: out
          retention-days: 30
