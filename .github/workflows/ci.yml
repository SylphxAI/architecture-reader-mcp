name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: validate release gate
    runs-on: sylphx-linux-standard
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate JSON manifests
        run: bun run validate

      - name: Validate Cargo workspace
        run: cargo metadata --format-version 1

      - name: Install workspace dependencies
        run: bun install

      - name: Build Rust engine
        run: bun run build:rust

      - name: Run Rust tests
        run: cargo test

      - name: Run MCP adapter tests
        run: bun test

      - name: Public surface audit
        run: bun run test:public-surface

      - name: Public benchmark proof
        run: bun run benchmark:public-proof

      - name: Release gate
        run: bun run benchmark:release-gate

      - name: Check whitespace errors
        run: git diff --check HEAD
