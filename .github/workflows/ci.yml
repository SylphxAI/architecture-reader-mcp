name: ci

# Optimistic merge. Merge groups and draft pull requests run the fast lane
# (clippy with warnings denied). A pull request marked ready also runs the
# full suite (verify.yml); after merge verify.yml runs again on main. `ci-ok`
# is the one required check. Public repository: GitHub-hosted standard
# runners, guarded so a private fork never runs them.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main-state:
    if: github.event_name == 'merge_group' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/main-red-gate@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          mode: observe

  lint:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # One release build: the tests reuse its dependency artifacts and the
      # binary is shared with every later job.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  plain-language:
    if: (github.event_name != 'merge_group') && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: SylphxAI/.github/.github/actions/plain-language@f9176dad2e49c6b99d75f1506fafac84632fe870

  identifiers:
    if: (github.event_name != 'merge_group') && github.event.repository.private == false
    name: Identifiers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Non-v7 ids on added lines (owner standards/identifiers.md)
        uses: SylphxAI/.github/.github/actions/identifiers@e4a5ea41cbcc87cd93914f89f0d7c3981c868bf9

  suite:
    if: github.event_name != 'merge_group' && !github.event.pull_request.draft && github.event.repository.private == false
    uses: ./.github/workflows/verify.yml
    secrets: inherit

  ci-ok:
    if: always() && github.event.repository.private == false
    needs: [main-state, lint, plain-language, identifiers, suite]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: SylphxAI/.github/.github/actions/needs-pass@05ac6474b96425bcb4965addd025a93e061b66c4
        with:
          needs: ${{ toJSON(needs) }}
          required: lint
          required-unless-merge-group: ${{ github.event.pull_request.draft && 'plain-language,identifiers' || 'plain-language,identifiers,suite' }}
