name: Bug report
description: Report a reproducible repomap problem.
labels:
- bug
- owner:sylphx-oss
body:
- type: markdown
  attributes:
    value: 'Search existing issues first. Use [Discussions](https://github.com/SylphxAI/repomap/discussions)
      for questions. Reports are public: use synthetic/public examples and redact secrets, personal data
      and private source material. Report vulnerabilities through the [security policy](https://github.com/SylphxAI/repomap/security/policy),
      not a public issue.'
- type: textarea
  id: environment
  attributes:
    label: Version and environment
    description: Include `repomap version`, installation method (npm, native binary, Cargo or Docker),
      OS/architecture, and Node or MCP client/browser version if relevant.
  validations:
    required: true
- type: textarea
  id: configuration
  attributes:
    label: Command, tool arguments and configuration
    description: CLI command or MCP tool name and JSON arguments; root selection, language, ignore rules,
      embedding/cache mode, or UI/browser details. For database reports, name the engine and schema source,
      never the connection string.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Minimal reproduction
    description: Numbered steps and a minimal public or synthetic repository with the relevant files,
      symbols and imports. For database mapping, share only a sanitized schema, not table rows or credentials.
  validations:
    required: true
- type: textarea
  id: result
  attributes:
    label: Expected and actual behavior
    description: Show the expected files, symbols, call path or graph behavior and the actual result,
      with file:line references when possible.
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Redacted logs
    description: Paste only the relevant error/output. Remove tokens, credentials, personal paths and
      private content; leave this blank if there are no useful logs.
  validations:
    required: false
